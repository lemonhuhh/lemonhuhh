<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Prabin Tamang — crystalline developer hero</title>
<desc id="desc">A dark navy animated banner with a slowly floating blue glass crystal and subtle starfield.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0F18"/><stop offset=".55" stop-color="#101D33"/><stop offset="1" stop-color="#07111F"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#5CC8FF" stop-opacity=".38"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9F6FF" stop-opacity=".95"/><stop offset=".35" stop-color="#5CC8FF" stop-opacity=".55"/><stop offset="1" stop-color="#304BBD" stop-opacity=".8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<circle cx="870" cy="180" r="180" fill="url(#glow)"/>
<g fill="#5CC8FF" opacity=".65">
  <circle cx="740" cy="58" r="1.5"/><circle cx="980" cy="70" r="1"/><circle cx="1100" cy="130" r="1.4"/>
  <circle cx="810" cy="300" r="1.2"/><circle cx="1040" cy="280" r="1.5"/><circle cx="680" cy="240" r="1"/>
  <circle cx="590" cy="80" r="1"/><circle cx="1150" cy="220" r="1"/>
</g>
<path d="M620 260 Q850 330 1130 245" fill="none" stroke="#5CC8FF" stroke-opacity=".22"/>
<g transform="translate(880 174)">
  <ellipse rx="125" ry="48" fill="none" stroke="#5CC8FF" stroke-opacity=".5" stroke-width="1.4" transform="rotate(-25)"/>
  <ellipse rx="110" ry="36" fill="none" stroke="#8B9CFF" stroke-opacity=".4" stroke-width="1.2" transform="rotate(40)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 5;0 -7;0 5" dur="6s" repeatCount="indefinite"/>
    <polygon points="0,-100 65,-28 45,52 0,88 -55,35 -62,-35" fill="url(#facet)" stroke="#A6E8FF" stroke-width="1.4"/>
    <polygon points="0,-100 0,0 -62,-35" fill="#B8F1FF" fill-opacity=".62"/>
    <polygon points="0,-100 65,-28 0,0" fill="#5CC8FF" fill-opacity=".72"/>
    <polygon points="0,0 65,-28 45,52" fill="#263F9E" fill-opacity=".75"/>
    <polygon points="0,0 45,52 0,88" fill="#72D8FF" fill-opacity=".65"/>
    <polygon points="0,0 0,88 -55,35" fill="#1B367A" fill-opacity=".85"/>
    <polygon points="0,0 -55,35 -62,-35" fill="#8B9CFF" fill-opacity=".5"/>
    <path d="M0 -100V88 M-62 -35L45 52 M65 -28L-55 35" stroke="#E4FAFF" stroke-opacity=".65" fill="none"/>
  </g>
  <circle cx="-83" cy="-67" r="3" fill="#BDEFFF"/><circle cx="93" cy="51" r="2" fill="#8B9CFF"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="70" y="80" fill="#8B98AA" font-size="15" letter-spacing="4">GITHUB PROFILE / DEVELOPER</text>
  <text x="68" y="157" fill="#F5F7FA" font-size="52" font-weight="700">Prabin <tspan fill="#5CC8FF">Tamang</tspan></text>
  <text x="72" y="198" fill="#B9D7F0" font-size="21">Full-Stack Developer in Progress</text>
  <text x="72" y="247" fill="#5CC8FF" font-family="monospace" font-size="17">Learning to Build  /  Exploring  /  Creating</text>
  <path d="M72 275H340" stroke="#5CC8FF" stroke-opacity=".65"/>
  <text x="72" y="307" fill="#8B98AA" font-size="13">github.com/lemonhuh</text>
</g>
</svg>